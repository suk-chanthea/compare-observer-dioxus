[package]
name = "compare-observer"
version = "0.1.0"
edition = "2021"
description = "File-watcher and deployment tool — Rust/Dioxus port"

[[bin]]
name = "compare-observer"
path = "src/main.rs"

[dependencies]
dioxus        = { version = "0.6", features = ["desktop"] }
tokio         = { version = "1",   features = ["full"] }
reqwest       = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde         = { version = "1",   features = ["derive"] }
serde_json    = "1"
chrono        = "0.4"
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
